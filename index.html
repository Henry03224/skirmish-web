<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Skirmish Web</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <button id="btnFs" class="fs-btn" type="button">FULL</button>
    <main id="stage">
      <canvas id="game" width="1280" height="720"></canvas>
      <div id="menu" class="overlay">
        <div class="panel">
          <h1>SKIRMISH</h1>
          <p class="sub">7 maps. Floors block people and bullets.</p>
          <label>Callsign
            <input id="nameInput" maxlength="12" placeholder="PLAYER" autocomplete="off" />
          </label>
          <p class="label">Map</p>
          <div id="mapPick" class="maps">
            <button type="button" class="mapcard on" data-map="canyon">Canyon</button>
            <button type="button" class="mapcard" data-map="keep">Keep</button>
            <button type="button" class="mapcard" data-map="warehouse">Warehouse</button>
            <button type="button" class="mapcard" data-map="ruins">Ruins</button>
            <button type="button" class="mapcard" data-map="forest">Forest</button>
            <button type="button" class="mapcard" data-map="docks">Docks</button>
            <button type="button" class="mapcard" data-map="ice">Ice</button>
          </div>
          <p class="label">Loadout</p>
          <div id="gunPick" class="maps">
            <button type="button" class="mapcard on" data-gun="pistol">Pistol</button>
            <button type="button" class="mapcard" data-gun="smg">SMG</button>
            <button type="button" class="mapcard" data-gun="shot">Shotgun</button>
            <button type="button" class="mapcard" data-gun="sniper">Sniper</button>
          </div>
          <div class="row"><button id="btnSolo">Play vs Bots</button></div>
          <div class="row">
            <button id="btnLocal" class="ghost">2P Same Screen</button>
            <button id="btnHost" class="ghost">Host Room</button>
          </div>
          <div class="row join">
            <input id="roomInput" maxlength="8" placeholder="ROOM CODE" autocomplete="off" />
            <button id="btnJoin" class="ghost">Join</button>
          </div>
          <p class="hint">Left stick move · right stick aim/fire · JET / NADE / GUN.</p>
        </div>
      </div>
      <div id="end" class="overlay hidden">
        <div class="panel">
          <h2 id="endTitle">Match over</h2>
          <p id="endBody"></p>
          <button id="btnAgain">Menu</button>
        </div>
      </div>
      <div id="touch" class="touch">
        <div class="stick" id="stickL"><i></i></div>
        <div class="mid">
          <button data-act="jump">JET</button>
          <button data-act="nade">NADE</button>
          <button data-act="swap">GUN</button>
        </div>
        <div class="stick fire" id="stickR"><i></i></div>
      </div>
    </main>
  </div>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/maps-data.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
