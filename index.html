<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Skirmish Web</title>
  <meta name="description" content="Original 2D jetpack stick shooter. Play in the browser vs bots, 2-player, or online rooms." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="mark">SW</span>
        <div>
          <strong>Skirmish Web</strong>
          <small>original stick shooter</small>
        </div>
      </div>
      <div id="hudMeta" class="hud-meta">Ready</div>
    </header>
    <main id="stage">
      <canvas id="game" width="1280" height="720"></canvas>
      <div id="menu" class="overlay">
        <div class="panel">
          <h1>SKIRMISH WEB</h1>
          <p class="sub">Classic LAN energy. Original code and stick figures. Not Mini Militia.</p>
          <label>Callsign
            <input id="nameInput" maxlength="12" placeholder="PLAYER" />
          </label>
          <div class="row">
            <button id="btnSolo">Play vs Bots</button>
            <button id="btnLocal">2P Same Screen</button>
          </div>
          <div class="row">
            <button id="btnHost" class="ghost">Host Online Room</button>
          </div>
          <div class="row join">
            <input id="roomInput" maxlength="8" placeholder="ROOM CODE" />
            <button id="btnJoin" class="ghost">Join</button>
          </div>
          <p class="hint">P1: WASD + Space jetpack + J fire / K grenade · P2: Arrows + Shift + / ?</p>
        </div>
      </div>
      <div id="end" class="overlay hidden">
        <div class="panel">
          <h2 id="endTitle">Match over</h2>
          <p id="endBody"></p>
          <button id="btnAgain">Menu</button>
        </div>
      </div>
      <div id="touch" class="touch hidden">
        <div class="pad" id="padMove"></div>
        <div class="btns">
          <button data-act="jump">JET</button>
          <button data-act="fire">FIRE</button>
          <button data-act="nade">NADE</button>
        </div>
      </div>
    </main>
  </div>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
