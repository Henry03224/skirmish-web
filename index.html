<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Skirmish Web</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <button id="btnMute" class="fs-btn mute-btn" type="button">SFX</button>
    <button id="btnFs" class="fs-btn" type="button">FULL</button>
    <main id="stage">
      <canvas id="game" width="1280" height="720"></canvas>
      <div id="menu" class="overlay">
        <div class="panel intro">
          <h1>SKIRMISH</h1>
          <p class="sub">Online</p>
          <label>Callsign
            <input id="nameInput" maxlength="12" placeholder="PLAYER" autocomplete="off" />
          </label>
          <div class="row"><button id="btnPlay">PLAY / HOST</button></div>
          <div class="row join">
            <input id="roomInput" maxlength="6" placeholder="CODE" autocomplete="off" />
            <button id="btnJoin" class="ghost">JOIN</button>
          </div>
          <div class="row"><button id="btnSolo" class="ghost">Solo vs Bots</button></div>
        </div>
      </div>
      <div id="lobby" class="overlay hidden">
        <div class="panel">
          <h1>ROOM</h1>
          <p id="lobbyCode" class="code">----</p>
          <p id="lobbyStatus" class="sub">Connecting...</p>
          <ul id="lobbyList" class="lobby-list"></ul>
          <div class="row"><button id="btnLeave" class="ghost">Leave</button></div>
        </div>
      </div>
      <div id="end" class="overlay hidden">
        <div class="panel">
          <h2 id="endTitle">Match over</h2>
          <p id="endBody"></p>
          <button id="btnAgain">Menu</button>
        </div>
      </div>
      <div id="touch" class="touch">
        <div class="stick" id="stickL"><i></i></div>
        <div class="stick fire" id="stickR"><i></i></div>
      </div>
    </main>
  </div>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/maps-data.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
